# Bosch Solution 2000 Mode 2 Monitor Configuration
panel:
  # Host IP or hostname of B426 / B426-M Ethernet module
  host: "192.168.20.151"
  
  # Default Automation Port for Bosch Mode 2 is 7700
  port: 7700

  # The CLI displays and stores this User Code, as requested for the local Windows tool.
  # NOTE: To read History Events, this user code must have "Master Code Functions" authority in A-Link Plus.
  user_code: ""

  # B426 normally exposes Mode 2 through TLS on port 7700.
  # Set false only for the local simulator or explicitly enabled Legacy TCP mode.
  use_tls: true


monitor:
  # Polling interval in seconds (default: 1.0)
  poll_interval: 1.0
  
  # Fetch history log immediately upon starting
  history_on_start: true

  # Number of initial history events to retrieve
  history_limit: 50

  # Output mode: "tui" (Rich interactive dashboard) or "plain" (streaming log lines)
  mode: "tui"
